<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容广场 - 探店达人营销平台</title>
    <link rel="stylesheet" href="/assets/css/common.css">
    <style>
        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: white;
            box-shadow: var(--shadow-sm);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--spacing-xl);
        }

        .navbar-brand {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .navbar-center {
            display: flex;
            align-items: center;
            gap: var(--spacing-xl);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .navbar-center a {
            color: var(--text-primary);
            font-weight: 500;
            transition: color 0.2s;
        }

        .navbar-center a:hover,
        .navbar-center a.active {
            color: var(--primary-color);
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        /* 主内容 */
        .main-content {
            padding-top: 64px;
            min-height: 100vh;
            background: var(--bg-light);
        }

        /* 页面头部 */
        .page-header {
            background: linear-gradient(135deg, #FFF4F0 0%, #FFFFFF 100%);
            padding: var(--spacing-xl) 0;
            text-align: center;
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
        }

        .page-header p {
            color: var(--text-secondary);
        }

        /* 筛选栏 */
        .filter-section {
            background: white;
            padding: var(--spacing-md) 0;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 64px;
            z-index: 50;
        }

        .filter-tabs {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 16px;
            border-radius: var(--radius-full);
            background: var(--bg-light);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 14px;
        }

        .filter-tab:hover {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .filter-tab.active {
            background: var(--primary-color);
            color: white;
        }

        /* 内容网格 */
        .showcase-section {
            padding: var(--spacing-xl) 0;
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-lg);
        }

        .showcase-card {
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .showcase-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .showcase-cover {
            width: 100%;
            height: 200px;
            background: var(--bg-light);
            object-fit: cover;
            position: relative;
        }

        .showcase-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .showcase-cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            background: linear-gradient(135deg, var(--primary-light) 0%, #FFE4D6 100%);
        }

        .showcase-badge {
            position: absolute;
            top: var(--spacing-sm);
            left: var(--spacing-sm);
            background: var(--primary-color);
            color: white;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
        }

        .showcase-platform {
            position: absolute;
            top: var(--spacing-sm);
            right: var(--spacing-sm);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
        }

        .showcase-body {
            padding: var(--spacing-md);
        }

        .showcase-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: var(--spacing-sm);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .showcase-author {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
        }

        .showcase-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            overflow: hidden;
        }

        .showcase-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .showcase-author-info {
            flex: 1;
            min-width: 0;
        }

        .showcase-author-name {
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .showcase-author-fans {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .showcase-stats {
            display: flex;
            gap: var(--spacing-md);
            font-size: 12px;
            color: var(--text-secondary);
        }

        .showcase-stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 达人详情弹窗 */
        .influencer-modal .modal {
            max-width: 700px;
        }

        .influencer-header {
            display: flex;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .influencer-avatar-lg {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .influencer-avatar-lg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .influencer-info h3 {
            font-size: 20px;
            margin-bottom: var(--spacing-xs);
        }

        .influencer-meta {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
            margin-bottom: var(--spacing-sm);
        }

        .influencer-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .influencer-tags {
            display: flex;
            gap: var(--spacing-xs);
            flex-wrap: wrap;
        }

        .influencer-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .influencer-stat-card {
            background: var(--bg-light);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            text-align: center;
        }

        .influencer-stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .influencer-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .influencer-portfolio-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }

        .influencer-portfolio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-sm);
        }

        .portfolio-item {
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--bg-light);
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 空状态 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: var(--spacing-xxl);
        }

        /* 页脚 */
        .footer {
            padding: var(--spacing-xl) 0;
            background: var(--bg-dark);
            color: white;
            text-align: center;
        }

        .footer p {
            opacity: 0.7;
            font-size: 14px;
        }

        @media (max-width: 1200px) {
            .showcase-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .showcase-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .navbar-center {
                display: none;
            }

            .influencer-stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .influencer-portfolio-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .showcase-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

            currentPage = page;
            const grid = document.getElementById('showcaseGrid');
            grid.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';

            try {
                const params = { page, per_page: 12, ...currentFilters };
                const res = await get('/showcase', params);

                if (res.code === 0 && res.data.items && res.data.items.length > 0) {
                    renderShowcase(res.data.items);
                    renderPagination(document.getElementById('pagination'), res.data.pagination, loadShowcase);
                    return;
                }
            } catch (err) {
                console.log('API请求失败，使用mock数据');

        function renderShowcase(items) {
            const grid = document.getElementById('showcaseGrid');

            if (items.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>暂无内容</p></div>';
                return;
            }

            grid.innerHTML = items.map(item => {
                const platformIcon = platformIcons[item.platform] || '📱';
                const platformName = platformNames[item.platform] || item.platform || '其他';

                return `
                    <div class="showcase-card" onclick="viewInfluencer(${item.influencer_id})">
                        <div class="showcase-cover">
                            ${item.cover_image
                                ? `<img src="${item.cover_image}" alt="${item.title}">`
                                : `<div class="showcase-cover-placeholder">🎬</div>`
                            }
                            ${item.is_featured ? '<span class="showcase-badge">精选</span>' : ''}
                            <span class="showcase-platform">${platformIcon} ${platformName}</span>
                        </div>
                        <div class="showcase-body">
                            <div class="showcase-title">${item.title}</div>
                            <div class="showcase-author">
                                <div class="showcase-avatar">
                                    ${item.influencer_avatar
                                        ? `<img src="${item.influencer_avatar}" alt="">`
                                        : '👤'
                                    }
                                </div>
                                <div class="showcase-author-info">
                                    <div class="showcase-author-name">${item.influencer_name || '达人'}</div>
                                    <div class="showcase-author-fans">${formatNumber(item.follower_count || 0)} 粉丝</div>
                                </div>
                            </div>
                            <div class="showcase-stats">
                                <span class="showcase-stat">👁 ${formatNumber(item.view_count || 0)}</span>
                                <span class="showcase-stat">❤️ ${formatNumber(item.like_count || 0)}</span>
                                <span class="showcase-stat">💬 ${formatNumber(item.comment_count || 0)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

        function renderInfluencerDetail(data) {
            const { influencer, portfolio } = data;
            const content = document.getElementById('influencerContent');
            const platformIcon = platformIcons[influencer.platform_type] || '📱';
            const platformName = platformNames[influencer.platform_type] || influencer.platform_type || '其他';

            content.innerHTML = `
                <div class="influencer-header">
                    <div class="influencer-avatar-lg">
                        ${influencer.avatar
                            ? `<img src="${influencer.avatar}" alt="">`
                            : '👤'
                        }
                    </div>
                    <div class="influencer-info">
                        <h3>${influencer.nickname || '达人'}</h3>
                        <div class="influencer-meta">

                            <span class="influencer-meta-item">📍 ${influencer.city || '未知'}</span>
                            <span class="influencer-meta-item">⭐ ${influencer.rating || 0} 评分</span>
                        </div>
                        <div class="influencer-tags">

                    </div>
                </div>

                <div class="influencer-stats-grid">

                    </div>
                    <div class="influencer-stat-card">
                        <div class="influencer-stat-value">${formatNumber(influencer.avg_views || 0)}</div>
                        <div class="influencer-stat-label">平均播放</div>
                    </div>
                    <div class="influencer-stat-card">
                        <div class="influencer-stat-value">${formatNumber(influencer.avg_likes || 0)}</div>
                        <div class="influencer-stat-label">平均点赞</div>
                    </div>
                    <div class="influencer-stat-card">
                        <div class="influencer-stat-value">${influencer.completed_tasks || 0}</div>
                        <div class="influencer-stat-label">完成任务</div>
                    </div>
                </div>

                ${influencer.bio ? `<p class="text-secondary mb-md">${influencer.bio}</p>` : ''}

                ${portfolio && portfolio.length > 0 ? `
                    <div class="influencer-portfolio-title">作品集 (${portfolio.length})</div>
                    <div class="influencer-portfolio-grid">
                        ${portfolio.slice(0, 6).map(work => `
                            <div class="portfolio-item">
                                ${work.cover_image
                                    ? `<img src="${work.cover_image}" alt="${work.title}">`
                                    : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--primary-light);">🎬</div>`

            `;
        }

        // 筛选标签点击
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                // 移除其他active
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                // 更新筛选条件
                const platform = this.dataset.platform;
                const featured = this.dataset.featured;

                currentFilters = {};
                if (platform) {
                    currentFilters.platform = platform;
                }
                if (featured) {
                    currentFilters.is_featured = featured;
                }

                loadShowcase(1);
