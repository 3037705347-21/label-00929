<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 商家中心</title>
    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="/merchant/assets/css/merchant.css">
</head>
<body>
    <div class="layout">
        <!-- 遮罩层 -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/merchant/index.html" class="sidebar-logo">🔥 探店达人</a>
                <span class="sidebar-badge">商家版</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/merchant/index.html" class="nav-item"><span class="nav-icon">📊</span><span>数据看板</span></a>
                <a href="/merchant/tasks.html" class="nav-item"><span class="nav-icon">📋</span><span>任务管理</span></a>
                <a href="/merchant/orders.html" class="nav-item active"><span class="nav-icon">📦</span><span>订单管理</span></a>
                <a href="/merchant/wallet.html" class="nav-item"><span class="nav-icon">💰</span><span>财务中心</span></a>
                <a href="/merchant/profile.html" class="nav-item"><span class="nav-icon">🏪</span><span>店铺设置</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <h1 class="page-title">订单管理</h1>
                </div>
                <div class="topbar-right">
                    <div class="user-dropdown">
                        <div class="user-info" onclick="toggleDropdown()">
                            <div class="user-avatar" id="userAvatar"></div>
                            <span class="user-name" id="userName">商家</span>
                        </div>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="javascript:logout()" class="dropdown-item danger">
                                <span>🚪</span>
                                <span>退出登录</span>
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content">
                <!-- 筛选栏 -->
                <div class="filter-bar">
                    <div class="filter-left">
                        <select class="form-control" style="width: 150px;" id="filterStatus">
                            <option value="">全部状态</option>
                            <option value="1">已报名</option>
                            <option value="2">已接单</option>
                            <option value="3">执行中</option>
                            <option value="4">待审核</option>
                            <option value="5">已完成</option>
                            <option value="6">已拒绝</option>
                        </select>
                        <button class="btn btn-search" onclick="loadOrders()">搜索</button>
                    </div>
                </div>

                <!-- 订单列表 -->
                <div class="card">
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>订单号</th>
                                    <th>任务</th>
                                    <th>达人</th>
                                    <th>佣金类型</th>
                                    <th>佣金/销售额</th>
                                    <th>状态</th>
                                    <th>报名时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="orderList">
                                <tr><td colspan="8" class="text-center text-secondary">暂无数据</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 聊天弹窗 -->
    <div class="modal-overlay" id="chatModal">
        <div class="modal" style="max-width:500px;">
            <div class="modal-header">
                <h3 class="modal-title">💬 与达人沟通</h3>
                <button class="modal-close" onclick="closeModal('chatModal')">&times;</button>
            </div>
            <div class="modal-body" style="padding:0;overflow:hidden;">
                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages">
                        <div class="chat-empty">
                            <div class="chat-empty-icon">💬</div>
                            <div>暂无消息，发送第一条消息开始沟通吧</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="输入消息..." onkeypress="if(event.keyCode===13)sendMessage()">
                <button class="chat-send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- CPS销售额录入弹窗 -->
    <div class="modal-overlay" id="cpsModal">
        <div class="modal" style="max-width: 450px;">
            <div class="modal-header">
                <h3 class="modal-title">录入核销数据</h3>
                <button class="modal-close" onclick="closeModal('cpsModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">CPS分成比例</label>
                    <div class="form-control" style="background:#f5f5f5;cursor:not-allowed;display:flex;align-items:center;" id="cpsRateDisplay">0%</div>
                </div>
                <div class="form-group">
                    <label class="form-label required">核销销售额（元）</label>
                    <input type="number" class="form-control" id="cpsSalesInput" placeholder="请输入通过推广产生的实际消费金额" min="0" step="0.01">
                    <div class="form-hint">录入通过推广链接或券码产生的实际消费金额</div>
                </div>
                <div class="form-group">
                    <label class="form-label">预计佣金</label>
                    <div class="form-control" style="background:#f5f5f5;cursor:not-allowed;color:var(--primary-color);font-weight:600;display:flex;align-items:center;" id="estimatedCommission">¥0.00</div>
                    <div class="form-hint">佣金 = 销售额 × CPS比例</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('cpsModal')">取消</button>
                <button class="btn btn-primary" onclick="submitCpsSales()">确认录入</button>
            </div>
        </div>
    </div>

    <script src="/assets/js/common.js"></script>
    <script>
        let currentPage = 1;
        let currentCpsOrder = null;

        // 聊天功能
        let currentChatOrderId = null;
        let chatPollingTimer = null;
        window.currentUserId = null;

        async function openChat(orderId) {
            currentChatOrderId = orderId;
            document.getElementById('chatInput').value = '';
            openModal('chatModal');
            await loadMessages();
            // 开始轮询新消息
            chatPollingTimer = setInterval(loadMessages, 5000);
        }

        // 重写关闭弹窗函数以处理聊天轮询
        const originalCloseModal = window.closeModal;
        window.closeModal = function(id) {
            if (id === 'chatModal' && chatPollingTimer) {
                clearInterval(chatPollingTimer);
                chatPollingTimer = null;
            }
            originalCloseModal(id);
        };

        async function loadMessages() {
            if (!currentChatOrderId) return;
            try {
                const res = await get('/merchant/messages', { order_id: currentChatOrderId, per_page: 100 });
                if (res.code === 0) {
                    renderMessages(res.data.items);
                }
            } catch (err) {
                console.error('加载消息失败', err);
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            if (!messages || messages.length === 0) {
                container.innerHTML = `
                    <div class="chat-empty">
                        <div class="chat-empty-icon">💬</div>
                        <div>暂无消息，发送第一条消息开始沟通吧</div>
                    </div>
                `;
                return;
            }

            const currentUserId = window.currentUserId;
            container.innerHTML = messages.map(msg => {
                const isSelf = msg.sender_id == currentUserId;
                const avatar = msg.avatar ? `<img src="${msg.avatar}" alt="">` : '👤';
                return `
                    <div class="chat-message ${isSelf ? 'self' : ''}">
                        <div class="chat-avatar">${avatar}</div>
                        <div class="chat-bubble">
                            <div class="chat-bubble-content">${escapeHtml(msg.content)}</div>
                            <div class="chat-bubble-time">${formatTime(msg.created_at)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            // 滚动到底部
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();
            if (isToday) {
                return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (!content || !currentChatOrderId) return;

            try {
                const res = await post('/merchant/messages', {
                    order_id: currentChatOrderId,
                    content: content
                });
                if (res.code === 0) {
                    input.value = '';
                    await loadMessages();
                } else {
                    showToast(res.message || '发送失败', 'error');
                }
            } catch (err) {
                showToast('发送失败', 'error');
            }
        }

        // 下拉菜单切换
        function toggleDropdown() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.user-dropdown')) {
                document.getElementById('dropdownMenu').classList.remove('show');
            }
        });

        // 加载用户信息
        async function loadUserInfo() {
            try {
                const res = await get('/auth/profile');
                if (res.code === 0) {
                    const { user, merchant } = res.data;
                    document.getElementById('userName').textContent = merchant?.shop_name || user?.username || '商家';
                    setUserAvatar(document.getElementById('userAvatar'), user?.avatar);
                    window.currentUserId = user?.id;
                }
            } catch (err) {
                console.error(err);
            }
        }

        // 加载订单列表
        async function loadOrders(page = 1) {
            currentPage = page;
            const status = document.getElementById('filterStatus').value;
            const urlParams = new URLSearchParams(window.location.search);
            const taskId = urlParams.get('task_id');

            try {
                const params = { page };
                if (status) params.status = status;
                if (taskId) params.task_id = taskId;

                const res = await get('/merchant/orders', params);
                if (res.code === 0) {
                    renderOrders(res.data.items);
                    renderPagination(document.getElementById('pagination'), res.data.pagination, loadOrders);
                }
            } catch (err) {
                showToast('加载失败', 'error');
            }
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('orderList');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-secondary">暂无数据</td></tr>';
                return;
            }

            tbody.innerHTML = orders.map(order => {
                // 佣金类型显示
                const commissionTypeText = order.commission_type == 1 ? '一口价' : 'CPS分成';

                // 佣金/销售额显示
                let commissionDisplay = '';
                if (order.commission_type == 1) {
                    commissionDisplay = `¥${formatMoney(order.commission_amount)}`;
                } else {
                    // CPS类型显示销售额和预计佣金
                    const cpsSales = parseFloat(order.cps_sales) || 0;
                    const cpsRate = parseFloat(order.cps_rate) || 0;
                    const estimatedCommission = cpsSales * cpsRate / 100;
                    if (cpsSales > 0) {
                        commissionDisplay = `<div>销售额: ¥${formatMoney(cpsSales)}</div><div class="text-sm text-secondary">佣金: ¥${formatMoney(estimatedCommission)} (${cpsRate}%)</div>`;
                    } else {
                        commissionDisplay = `<span class="text-secondary">待录入 (${cpsRate}%)</span>`;
                    }
                }

                // 操作按钮
                let actions = '';
                // 沟通按钮（已接单、执行中、待审核、已完成状态都可以沟通）
                const canChat = [2, 3, 4, 5].includes(order.status);
                const chatBtn = canChat ? `<button class="btn btn-chat btn-sm" onclick="openChat(${order.id})">沟通</button>` : '';

                if (order.status == 1) {
                    actions = `
                        <button class="btn btn-primary btn-sm" onclick="acceptOrder(${order.id})">接受</button>
                        <button class="btn btn-secondary btn-sm" onclick="rejectOrder(${order.id})">拒绝</button>
                    `;
                } else if (order.status == 4) {
                    // 待审核状态
                    if (order.commission_type == 2) {
                        // CPS类型需要先录入销售额
                        actions = `
                            <button class="btn btn-sm" style="background:#faad14;color:#fff;" onclick="openCpsModal(${order.id}, ${order.cps_rate}, ${order.cps_sales || 0})">录入核销</button>
                            <button class="btn btn-primary btn-sm" onclick="approveWork(${order.id})">通过</button>
                            <button class="btn btn-secondary btn-sm" onclick="rejectWork(${order.id})">驳回</button>
                            ${chatBtn}
                        `;
                    } else {
                        actions = `
                            <button class="btn btn-primary btn-sm" onclick="approveWork(${order.id})">通过</button>
                            <button class="btn btn-secondary btn-sm" onclick="rejectWork(${order.id})">驳回</button>
                            ${chatBtn}
                        `;
                    }
                } else if (order.commission_type == 2 && [2, 3, 5].includes(order.status)) {
                    // CPS订单在已接单、执行中、已完成状态都可以录入/更新核销
                    const btnText = order.status == 5 ? '更新核销' : '录入核销';
                    actions = `<button class="btn btn-sm" style="background:#faad14;color:#fff;" onclick="openCpsModal(${order.id}, ${order.cps_rate}, ${order.cps_sales || 0})">${btnText}</button>${chatBtn}`;
                } else if (canChat) {
                    actions = chatBtn;
                }

                return `
                    <tr>
                        <td>${order.order_no}</td>
                        <td>${order.task_title || '-'}</td>
                        <td>${order.influencer_name || '-'}</td>
                        <td><span class="tag ${order.commission_type == 1 ? 'tag-info' : 'tag-warning'}">${commissionTypeText}</span></td>
                        <td>${commissionDisplay}</td>
                        <td>${getStatusTag(order.status, 'order')}</td>
                        <td>${formatDate(order.applied_at)}</td>
                        <td>${actions}</td>
                    </tr>
                `;
            }).join('');
        }

        // 打开CPS销售额录入弹窗
        function openCpsModal(orderId, cpsRate, currentSales) {
            currentCpsOrder = { id: orderId, cpsRate: cpsRate };
            document.getElementById('cpsRateDisplay').textContent = cpsRate + '%';
            document.getElementById('cpsSalesInput').value = currentSales > 0 ? currentSales : '';
            updateEstimatedCommission();
            openModal('cpsModal');
        }

        // 更新预计佣金显示
        function updateEstimatedCommission() {
            const sales = parseFloat(document.getElementById('cpsSalesInput').value) || 0;
            const rate = currentCpsOrder?.cpsRate || 0;
            const commission = sales * rate / 100;
            document.getElementById('estimatedCommission').textContent = '¥' + formatMoney(commission);
        }

        // 监听销售额输入
        document.getElementById('cpsSalesInput').addEventListener('input', updateEstimatedCommission);

        // 提交CPS销售额
        async function submitCpsSales() {
            const sales = parseFloat(document.getElementById('cpsSalesInput').value);
            if (isNaN(sales) || sales < 0) {
                showToast('请输入有效的销售额', 'error');
                return;
            }

            try {
                const res = await put(`/merchant/orders/${currentCpsOrder.id}/cps-sales`, { cps_sales: sales });
                if (res.code === 0) {
                    showToast('核销数据已录入');
                    closeModal('cpsModal');
                    loadOrders(currentPage);
                } else {
                    showToast(res.message, 'error');
                }
            } catch (err) {
                showToast('操作失败', 'error');
            }
        }

        // 接受报名
        async function acceptOrder(id) {
            if (!await confirm('确定接受该达人的报名吗？')) return;
            try {
                const res = await post(`/merchant/applications/${id}/accept`);
                if (res.code === 0) {
                    showToast('操作成功');
                    loadOrders(currentPage);
                } else {
                    showToast(res.message, 'error');
                }
            } catch (err) {
                showToast('操作失败', 'error');
            }
        }

        // 拒绝报名
        async function rejectOrder(id) {
            if (!await confirm('确定拒绝该达人的报名吗？')) return;
            try {
                const res = await post(`/merchant/applications/${id}/reject`);
                if (res.code === 0) {
                    showToast('操作成功');
                    loadOrders(currentPage);
                } else {
                    showToast(res.message, 'error');
                }
            } catch (err) {
                showToast('操作失败', 'error');
            }
        }

        // 通过作品
        async function approveWork(id) {
            if (!await confirm('确定通过该作品吗？通过后将结算佣金给达人。')) return;
            try {
                const res = await post(`/merchant/orders/${id}/approve`);
                if (res.code === 0) {
                    showToast('审核通过');
                    loadOrders(currentPage);
                } else {
                    showToast(res.message, 'error');
                }
            } catch (err) {
                showToast('操作失败', 'error');
            }
        }

        // 驳回作品
        async function rejectWork(id) {
            if (!await confirm('确定驳回该作品吗？')) return;
            try {
                const res = await post(`/merchant/orders/${id}/reject-work`);
                if (res.code === 0) {
                    showToast('已驳回');
                    loadOrders(currentPage);
                } else {
                    showToast(res.message, 'error');
                }
            } catch (err) {
                showToast('操作失败', 'error');
            }
        }

        // 初始化
        loadUserInfo();

        // 从URL获取状态参数
        const urlParams = new URLSearchParams(window.location.search);
        const statusParam = urlParams.get('status');
        if (statusParam) {
            const filterSelect = document.getElementById('filterStatus');
            filterSelect.value = statusParam;
            // 更新自定义 select 显示
            if (typeof updateCustomSelect === 'function') {
                updateCustomSelect(filterSelect);
            }
        }

        loadOrders();

        // 侧边栏切换
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }
    </script>
</body>
</html>
