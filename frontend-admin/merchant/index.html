<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家中心 - 探店达人营销平台</title>
    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="/merchant/assets/css/merchant.css">
</head>
<body>
    <div class="layout">
        <!-- 遮罩层 -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/merchant/index.html" class="sidebar-logo">🔥 探店达人</a>
                <span class="sidebar-badge">商家版</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/merchant/index.html" class="nav-item active">
                    <span class="nav-icon">📊</span>
                    <span>数据看板</span>
                </a>
                <a href="/merchant/tasks.html" class="nav-item">
                    <span class="nav-icon">📋</span>
                    <span>任务管理</span>
                </a>
                <a href="/merchant/orders.html" class="nav-item">
                    <span class="nav-icon">📦</span>
                    <span>订单管理</span>
                </a>
                <a href="/merchant/wallet.html" class="nav-item">
                    <span class="nav-icon">💰</span>
                    <span>财务中心</span>
                </a>
                <a href="/merchant/profile.html" class="nav-item">
                    <span class="nav-icon">🏪</span>
                    <span>店铺设置</span>
                </a>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <h1 class="page-title">数据看板</h1>
                </div>
                <div class="topbar-right">
                    <div class="user-dropdown">
                        <div class="user-info" onclick="toggleDropdown()">
                            <div class="user-avatar" id="userAvatar"></div>
                            <span class="user-name" id="userName">商家</span>
                        </div>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="javascript:logout()" class="dropdown-item danger">
                                <span>🚪</span>
                                <span>退出登录</span>
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <!-- 内容区 -->
            <div class="content">
                <!-- 统计卡片 -->
                <div class="grid grid-4 mb-lg">
                    <div class="stat-card">
                        <div class="stat-card-icon balance">💰</div>
                        <div class="stat-card-value" id="statBalance">0.00</div>
                        <div class="stat-card-label">账户余额（元）</div>
                        <div class="stat-card-trend" id="statFrozen">冻结: ¥0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-icon tasks">📋</div>
                        <div class="stat-card-value" id="statActiveTasks">0</div>
                        <div class="stat-card-label">进行中任务</div>
                        <div class="stat-card-trend" id="statTotalTasks">累计发布: 0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-icon orders">📦</div>
                        <div class="stat-card-value" id="statCompletedOrders">0</div>
                        <div class="stat-card-label">已完成订单</div>
                        <div class="stat-card-trend" id="statPendingOrders">待审核: 0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-icon spent">💳</div>
                        <div class="stat-card-value" id="statTotalSpent">0.00</div>
                        <div class="stat-card-label">累计支出（元）</div>
                        <div class="stat-card-trend" id="statMonthSpent">本月: ¥0.00</div>
                    </div>
                </div>

                <!-- 快捷操作 -->
                <div class="card mb-lg">
                    <div class="card-header">
                        <h3 class="card-title">快捷操作</h3>
                    </div>
                    <div class="quick-actions">
                        <a href="/merchant/tasks.html?action=create" class="quick-action-item">
                            <span class="quick-action-icon">📝</span>
                            <span>发布新任务</span>
                        </a>
                        <a href="/merchant/wallet.html?action=recharge" class="quick-action-item">
                            <span class="quick-action-icon">💳</span>
                            <span>账户充值</span>
                        </a>
                        <a href="/merchant/orders.html?status=4" class="quick-action-item">
                            <span class="quick-action-icon">✅</span>
                            <span>待审核订单</span>
                        </a>
                        <a href="/merchant/profile.html" class="quick-action-item">
                            <span class="quick-action-icon">⚙️</span>
                            <span>店铺设置</span>
                        </a>
                    </div>
                </div>

                <!-- 趋势分析图表 -->
                <div class="card mb-lg">
                    <div class="card-header">
                        <h3 class="card-title">数据分析</h3>
                        <div class="card-tools">
                            <select id="merchantChartPeriod" onchange="reloadMerchantCharts()" style="width: 100px;">
                                <option value="day">按日</option>
                                <option value="week" selected>按周</option>
                                <option value="month">按月</option>
                            </select>
                            <button class="btn btn-secondary btn-sm ml-sm" onclick="exportMerchantAnalytics()">📥 导出</button>
                        </div>
                    </div>
                    <div class="grid grid-2">
                        <div class="chart-container" style="height: 300px;">
                            <canvas id="commissionChart"></canvas>
                        </div>
                        <div class="chart-container" style="height: 300px;">
                            <canvas id="orderTrendChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- ROI分析与达人效果对比 -->
                <div class="grid grid-2 mb-lg">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">任务ROI分析 TOP10</h3>
                        </div>
                        <div class="chart-container" style="height: 350px;">
                            <canvas id="roiChart"></canvas>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">达人效果对比 TOP5</h3>
                        </div>
                        <div class="chart-container" style="height: 350px;">
                            <canvas id="influencerCompareChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 佣金支出明细 -->
                <div class="card mb-lg">
                    <div class="card-header">
                        <h3 class="card-title">佣金支出明细</h3>
                        <button class="btn btn-secondary btn-sm" onclick="exportCommissionDetail()">📥 导出</button>
                    </div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>任务</th>
                                    <th>达人</th>
                                    <th>佣金类型</th>
                                    <th>支出金额</th>
                                    <th>关联订单</th>
                                </tr>
                            </thead>
                            <tbody id="commissionTable">
                                <tr>
                                    <td colspan="6" class="text-center text-secondary">暂无数据</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 最近任务 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">最近任务</h3>
                        <a href="/merchant/tasks.html" class="btn btn-secondary btn-sm">查看全部</a>
                    </div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>任务标题</th>
                                    <th>类型</th>
                                    <th>佣金</th>
                                    <th>报名/接单</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                </tr>
                            </thead>
                            <tbody id="recentTasks">
                                <tr>
                                    <td colspan="6" class="text-center text-secondary">暂无数据</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/assets/js/common.js"></script>
    <script>
        // 下拉菜单切换
        function toggleDropdown() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        // 点击外部关闭下拉菜单
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.user-dropdown')) {
                document.getElementById('dropdownMenu').classList.remove('show');
            }
        });

        // 加载数据
        async function loadDashboard() {
            try {
                const res = await get('/merchant/dashboard');
                if (res.code === 0) {
                    const { tasks, orders, wallet } = res.data;

                    document.getElementById('statBalance').textContent = formatMoney(wallet?.balance || 0);
                    document.getElementById('statFrozen').textContent = '冻结: ¥' + formatMoney(wallet?.frozen_amount || 0);
                    document.getElementById('statActiveTasks').textContent = tasks?.active || 0;
                    document.getElementById('statTotalTasks').textContent = '累计发布: ' + (tasks?.total || 0);
                    document.getElementById('statCompletedOrders').textContent = orders?.completed || 0;
                    document.getElementById('statPendingOrders').textContent = '待审核: ' + (orders?.pending || 0);
                    document.getElementById('statTotalSpent').textContent = formatMoney(wallet?.total_expense || 0);
                    document.getElementById('statMonthSpent').textContent = '本月: ¥' + formatMoney(tasks?.month_spent || 0);
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function loadRecentTasks() {
            try {
                const res = await get('/merchant/tasks', { per_page: 5 });
                if (res.code === 0 && res.data.items.length > 0) {
                    renderTasks(res.data.items);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderTasks(tasks) {
            const tbody = document.getElementById('recentTasks');
            tbody.innerHTML = tasks.map(task => `
                <tr>
                    <td><a href="/merchant/tasks.html?id=${task.id}">${task.title}</a></td>
                    <td>${task.task_type == 1 ? '云探店' : '到店实探'}</td>
                    <td>${task.commission_type == 1 ? '¥' + formatMoney(task.commission_amount) : task.cps_rate + '%分成'}</td>
                    <td>${task.applied_count}/${task.accepted_count}</td>
                    <td>${getStatusTag(task.status, 'task')}</td>
                    <td>${formatDate(task.created_at)}</td>
                </tr>
            `).join('');
        }

        // 加载用户信息
        async function loadUserInfo() {
            try {
                const res = await get('/auth/profile');
                if (res.code === 0) {
                    const { user, merchant } = res.data;
                    document.getElementById('userName').textContent = merchant?.shop_name || user?.username || '商家';
                    setUserAvatar(document.getElementById('userAvatar'), user?.avatar);
                }
            } catch (err) {
                console.error(err);
            }
        }

        // 初始化
        loadUserInfo();
        loadDashboard();
        loadRecentTasks();

        // 侧边栏切换
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        // 商家图表实例存储
        let merchantCharts = {};

        // 加载商家端所有图表
        async function loadMerchantCharts() {
            try {
                const period = document.getElementById('merchantChartPeriod').value;
                const res = await get('/merchant/dashboard/analytics', { period });

                if (res.code === 0) {
                    const { trends, roi_data, influencer_compare, commission_details } = res.data;

                    // 销毁旧图表
                    Object.values(merchantCharts).forEach(chart => {
                        if (chart) chart.destroy();
                    });
                    merchantCharts = {};

                    // 佣金支出趋势图
                    if (trends?.commission) {
                        merchantCharts.commission = await createTrendChart('commissionChart', {
                            title: '佣金支出趋势',
                            labels: trends.commission.labels,
                            datasets: [{
                                label: '佣金支出(元)',
                                data: trends.commission.data,
                                borderColor: chartColors.danger,
                                backgroundColor: chartColors.dangerBg
                            }]
                        });
                    }

                    // 订单完成趋势图
                    if (trends?.orders) {
                        merchantCharts.orderTrend = await createTrendChart('orderTrendChart', {
                            title: '订单完成趋势',
                            labels: trends.orders.labels,
                            datasets: [{
                                label: '完成订单数',
                                data: trends.orders.data,
                                borderColor: chartColors.success,
                                backgroundColor: chartColors.successBg
                            }]
                        });
                    }

                    // ROI分析图表（任务投入产出比）
                    if (roi_data) {
                        merchantCharts.roi = await createTrendChart('roiChart', {
                            title: '任务ROI分析',
                            labels: roi_data.labels,
                            datasets: [{
                                label: 'ROI(%)',
                                data: roi_data.data,
                                borderColor: chartColors.info,
                                backgroundColor: chartColors.infoBg,
                                type: 'bar'
                            }],
                            type: 'bar'
                        });
                    }

                    // 达人效果对比图表
                    if (influencer_compare) {
                        merchantCharts.influencerCompare = await createTrendChart('influencerCompareChart', {
                            title: '达人效果对比',
                            labels: influencer_compare.labels,
                            datasets: [
                                {
                                    label: '完成订单数',
                                    data: influencer_compare.order_counts,
                                    borderColor: chartColors.primary,
                                    backgroundColor: chartColors.primaryBg
                                },
                                {
                                    label: '平均播放量',
                                    data: influencer_compare.play_counts,
                                    borderColor: chartColors.warning,
                                    backgroundColor: chartColors.warningBg
                                }
                            ]
                        });
                    }

                    // 渲染佣金支出明细表格
                    if (commission_details && commission_details.length > 0) {
                        const tbody = document.getElementById('commissionTable');
                        tbody.innerHTML = commission_details.map(detail => `
                            <tr>
                                <td>${formatDate(detail.date, 'YYYY-MM-DD')}</td>
                                <td>${detail.task_title || '-'}</td>
                                <td>${detail.influencer_name || '-'}</td>
                                <td>${detail.commission_type == 1 ? '固定佣金' : 'CPS分成'}</td>
                                <td><span class="text-danger">¥${formatMoney(detail.amount)}</span></td>
                                <td>${detail.order_no || '-'}</td>
                            </tr>
                        `).join('');
                    }
                }
            } catch (err) {
                console.error('Load merchant charts error:', err);
            }
        }

        // 切换时间周期重新加载图表
        function reloadMerchantCharts() {
            loadMerchantCharts();
        }

        // 导出商家分析数据
        async function exportMerchantAnalytics() {
            const period = document.getElementById('merchantChartPeriod').value;
            await fetchExportData('/merchant/dashboard/analytics/export', { period }, '商家分析报表_' + new Date().toISOString().slice(0,10));
        }

        // 导出佣金明细
        async function exportCommissionDetail() {
            await fetchExportData('/merchant/commission/export', {}, '佣金支出明细_' + new Date().toISOString().slice(0,10));
        }

        // 页面加载完成初始化图表
        document.addEventListener('DOMContentLoaded', function() {
            loadMerchantCharts();
        });
    </script>
</body>
</html>
