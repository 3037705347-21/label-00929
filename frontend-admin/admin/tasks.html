<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务审核 - 管理后台</title>
    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="/admin/assets/css/admin.css">
</head>
<body>
    <div class="layout">
        <!-- 遮罩层 -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/admin/index.html" class="sidebar-logo">🔐 管理后台</a>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/index.html" class="nav-item"><span class="nav-icon">📊</span><span>数据看板</span></a>
                <div class="nav-group">
                    <div class="nav-group-title">用户管理</div>
                    <a href="/admin/merchants.html" class="nav-item"><span class="nav-icon">🏪</span><span>商家管理</span></a>
                    <a href="/admin/influencers.html" class="nav-item"><span class="nav-icon">🎬</span><span>达人管理</span></a>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">内容管理</div>
                    <a href="/admin/tasks.html" class="nav-item active"><span class="nav-icon">📋</span><span>任务审核</span></a>
                    <a href="/admin/works.html" class="nav-item"><span class="nav-icon">🎨</span><span>作品审核</span></a>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">财务管理</div>
                    <a href="/admin/withdrawals.html" class="nav-item"><span class="nav-icon">💳</span><span>提现审核</span></a>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">系统设置</div>
                    <a href="/admin/categories.html" class="nav-item"><span class="nav-icon">📁</span><span>分类管理</span></a>
                    <a href="/admin/settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>系统配置</span></a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <h1 class="page-title">任务审核</h1>
                </div>
                <div class="topbar-right">
                    <div class="user-dropdown">
                        <div class="user-info" onclick="toggleDropdown()">
                            <div class="user-avatar" id="userAvatar"></div>
                            <span class="user-name" id="userName">管理员</span>
                        </div>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="javascript:logout()" class="dropdown-item danger"><span>🚪</span><span>退出登录</span></a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content">
                <div class="filter-bar" style="background:white;padding:var(--spacing-md);border-radius:var(--radius-lg);margin-bottom:var(--spacing-md);">
                    <select class="form-control" style="width:150px;" id="filterStatus">
                        <option value="">全部状态</option>
                        <option value="1">待审核</option>
                        <option value="2">进行中</option>
                        <option value="3">已结束</option>
                        <option value="5">已拒绝</option>
                    </select>
                    <input type="text" class="form-control" style="width:200px;" id="filterKeyword" placeholder="搜索任务标题">
                    <button class="btn btn-primary" onclick="loadTasks()">搜索</button>
                </div>

                <div class="card">
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>任务标题</th>
                                    <th>商家</th>
                                    <th>任务类型</th>
                                    <th>佣金</th>
                                    <th>预算</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="taskList">
                                <tr><td colspan="9" class="text-center text-secondary">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 任务详情弹窗 -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal" style="max-width:700px;">
            <div class="modal-header">
                <h3 class="modal-title">任务详情</h3>
                <button class="modal-close" onclick="closeModal('taskModal')">&times;</button>
            </div>
            <div class="modal-body" id="taskDetail"></div>
            <div class="modal-footer" id="taskActions"></div>
        </div>
    </div>

    <script src="/assets/js/common.js"></script>
    <script>
        const user = getUser();
        if (!user || user.user_type != 3) window.location.href = '/admin/login.html';

        function toggleDropdown() { document.getElementById('dropdownMenu').classList.toggle('show'); }
        document.addEventListener('click', e => { if (!e.target.closest('.user-dropdown')) document.getElementById('dropdownMenu').classList.remove('show'); });

        function loadUserInfo() {
            if (user) {
                document.getElementById('userName').textContent = user.username;
                setUserAvatar(document.getElementById('userAvatar'), user.avatar);
            }
        }

        let currentPage = 1;

        async function loadTasks(page = 1) {
            currentPage = page;
            const status = document.getElementById('filterStatus').value;
            const keyword = document.getElementById('filterKeyword').value;
            try {
                const res = await get('/admin/tasks', { page, status: status || undefined, keyword: keyword || undefined });
                if (res.code === 0) {
                    renderTasks(res.data.items);
                    renderPagination(document.getElementById('pagination'), res.data.pagination, loadTasks);
                } else {
                    showToast(res.message || '加载失败', 'error');
                    document.getElementById('taskList').innerHTML = '<tr><td colspan="9" class="text-center text-secondary">加载失败</td></tr>';
                }
            } catch (err) {
                console.error('loadTasks error:', err);
                showToast('加载失败', 'error');
                document.getElementById('taskList').innerHTML = '<tr><td colspan="9" class="text-center text-secondary">加载失败</td></tr>';
            }
        }

        function renderTasks(tasks) {
            const tbody = document.getElementById('taskList');
            if (!tasks.length) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center text-secondary">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = tasks.map(t => `
                <tr>
                    <td>${t.id}</td>
                    <td><a href="javascript:viewTask(${t.id})" class="text-primary">${t.title}</a></td>
                    <td>${t.shop_name || '-'}</td>
                    <td>${t.task_type == 1 ? '云探店' : '到店实探'}</td>
                    <td>${t.commission_type == 1 ? '¥' + formatMoney(t.commission_amount) : t.cps_rate + '%分成'}</td>
                    <td>¥${formatMoney(t.total_budget)}</td>
                    <td>${getStatusTag(t.status, 'task')}</td>
                    <td>${formatDate(t.created_at)}</td>
                    <td>
                        ${t.status == 1 ? `
                            <button class="btn btn-success btn-sm" onclick="approveTask(${t.id})">通过</button>
                            <button class="btn btn-danger btn-sm" onclick="rejectTask(${t.id})">拒绝</button>
                        ` : `<button class="btn btn-sm" onclick="viewTask(${t.id})">查看</button>`}
                    </td>
                </tr>
            `).join('');
        }

        async function viewTask(id) {
            try {
                const res = await get(`/admin/tasks/${id}`);
                if (res.code === 0) {
                    const t = res.data;
                    document.getElementById('taskDetail').innerHTML = `
                        <div class="detail-section">
                            <div class="detail-row"><div class="detail-label">任务标题</div><div class="detail-value">${t.title}</div></div>
                            <div class="detail-row"><div class="detail-label">商家</div><div class="detail-value">${t.shop_name || '-'}</div></div>
                            <div class="detail-row"><div class="detail-label">任务类型</div><div class="detail-value">${t.task_type == 1 ? '云探店' : '到店实探'}</div></div>
                            <div class="detail-row"><div class="detail-label">佣金类型</div><div class="detail-value">${t.commission_type == 1 ? '一口价' : 'CPS分成'}</div></div>
                            <div class="detail-row"><div class="detail-label">佣金金额</div><div class="detail-value">${t.commission_type == 1 ? '¥' + formatMoney(t.commission_amount) : t.cps_rate + '%分成'}</div></div>
                            <div class="detail-row"><div class="detail-label">任务预算</div><div class="detail-value">¥${formatMoney(t.total_budget)}</div></div>
                            <div class="detail-row"><div class="detail-label">招募人数</div><div class="detail-value">${t.max_influencers}人</div></div>
                            <div class="detail-row"><div class="detail-label">最低粉丝</div><div class="detail-value">${t.min_followers > 0 ? formatNumber(t.min_followers) : '不限'}</div></div>
                            <div class="detail-row"><div class="detail-label">发布平台</div><div class="detail-value">${t.publish_platform || '-'}</div></div>
                            <div class="detail-row"><div class="detail-label">内容形式</div><div class="detail-value">${t.content_form || '-'}</div></div>
                            <div class="detail-row"><div class="detail-label">有效期</div><div class="detail-value">${formatDate(t.start_date)} ~ ${formatDate(t.end_date)}</div></div>
                            <div class="detail-row"><div class="detail-label">状态</div><div class="detail-value">${getStatusTag(t.status, 'task')}</div></div>
                            <div class="detail-row full-width"><div class="detail-label">任务要求</div><div class="detail-value" style="white-space:pre-wrap;">${t.requirements || '-'}</div></div>
                        </div>
                    `;
                    document.getElementById('taskActions').innerHTML = t.status == 1 ? `
                        <button class="btn btn-success" onclick="approveTask(${t.id});closeModal('taskModal')">审核通过</button>
                        <button class="btn btn-danger" onclick="rejectTask(${t.id});closeModal('taskModal')">审核拒绝</button>
                    ` : `<button class="btn" onclick="closeModal('taskModal')">关闭</button>`;
                    openModal('taskModal');
                }
            } catch (err) { showToast('加载失败', 'error'); }
        }

        async function approveTask(id) {
            if (!await confirm('确定通过该任务的审核吗？')) return;
            try {
                const res = await post(`/admin/tasks/${id}/review`, { approved: true });
                if (res.code === 0) { showToast('审核通过'); loadTasks(currentPage); }
                else showToast(res.message, 'error');
            } catch (err) { showToast('操作失败', 'error'); }
        }

        async function rejectTask(id) {
            const note = await prompt('请输入拒绝原因：');
            if (note === null) return;
            try {
                const res = await post(`/admin/tasks/${id}/review`, { approved: false, note });
                if (res.code === 0) { showToast('已拒绝'); loadTasks(currentPage); }
                else showToast(res.message, 'error');
            } catch (err) { showToast('操作失败', 'error'); }
        }

        loadUserInfo();

        // 先从URL参数设置筛选值，再加载数据
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('status')) {
            document.getElementById('filterStatus').value = urlParams.get('status');
        }
        loadTasks();

        // 侧边栏切换
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }
    </script>
</body>
</html>
