<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提现审核 - 管理后台</title>
    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="/admin/assets/css/admin.css">
</head>
<body>
    <div class="layout">
        <!-- 遮罩层 -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/admin/index.html" class="sidebar-logo">🔐 管理后台</a>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/index.html" class="nav-item"><span class="nav-icon">📊</span><span>数据看板</span></a>
                <div class="nav-group">
                    <div class="nav-group-title">用户管理</div>
                    <a href="/admin/merchants.html" class="nav-item"><span class="nav-icon">🏪</span><span>商家管理</span></a>
                    <a href="/admin/influencers.html" class="nav-item"><span class="nav-icon">🎬</span><span>达人管理</span></a>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">内容管理</div>
                    <a href="/admin/tasks.html" class="nav-item"><span class="nav-icon">📋</span><span>任务审核</span></a>
                    <a href="/admin/works.html" class="nav-item"><span class="nav-icon">🎨</span><span>作品审核</span></a>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">财务管理</div>
                    <a href="/admin/withdrawals.html" class="nav-item active"><span class="nav-icon">💳</span><span>提现审核</span></a>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">系统设置</div>
                    <a href="/admin/categories.html" class="nav-item"><span class="nav-icon">📁</span><span>分类管理</span></a>
                    <a href="/admin/settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>系统配置</span></a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <h1 class="page-title">提现审核</h1>
                </div>
                <div class="topbar-right">
                    <div class="user-dropdown">
                        <div class="user-info" onclick="toggleDropdown()">
                            <div class="user-avatar" id="userAvatar"></div>
                            <span class="user-name" id="userName">管理员</span>
                        </div>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="javascript:logout()" class="dropdown-item danger"><span>🚪</span><span>退出登录</span></a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content">
                <div class="filter-bar" style="background:white;padding:var(--spacing-md);border-radius:var(--radius-lg);margin-bottom:var(--spacing-md);">
                    <select class="form-control" style="width:150px;" id="filterStatus">
                        <option value="">全部状态</option>
                        <option value="0">待审核</option>
                        <option value="1">已通过</option>
                        <option value="2">已拒绝</option>
                        <option value="3">已打款</option>
                    </select>
                    <button class="btn btn-primary" onclick="loadWithdrawals()">搜索</button>
                </div>

                <div class="card">
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>提现单号</th>
                                    <th>用户</th>
                                    <th>金额</th>
                                    <th>手续费</th>
                                    <th>实际到账</th>
                                    <th>提现方式</th>
                                    <th>账号</th>
                                    <th>状态</th>
                                    <th>申请时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="withdrawalList">
                                <tr><td colspan="10" class="text-center text-secondary">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/assets/js/common.js"></script>
    <script>
        const user = getUser();
        if (!user || user.user_type != 3) window.location.href = '/admin/login.html';

        function toggleDropdown() { document.getElementById('dropdownMenu').classList.toggle('show'); }
        document.addEventListener('click', e => { if (!e.target.closest('.user-dropdown')) document.getElementById('dropdownMenu').classList.remove('show'); });

        function loadUserInfo() {
            if (user) {
                document.getElementById('userName').textContent = user.username;
                setUserAvatar(document.getElementById('userAvatar'), user.avatar);
            }
        }

        let currentPage = 1;

        async function loadWithdrawals(page = 1) {
            currentPage = page;
            const status = document.getElementById('filterStatus').value;
            try {
                const res = await get('/admin/withdrawals', { page, status: status || undefined });
                if (res.code === 0) {
                    renderWithdrawals(res.data.items);
                    renderPagination(document.getElementById('pagination'), res.data.pagination, loadWithdrawals);
                }
            } catch (err) { showToast('加载失败', 'error'); }
        }

        function renderWithdrawals(withdrawals) {
            const tbody = document.getElementById('withdrawalList');
            if (!withdrawals.length) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center text-secondary">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = withdrawals.map(w => `
                <tr>
                    <td>${w.withdraw_no}</td>
                    <td>${w.username || '-'}</td>
                    <td>¥${formatMoney(w.amount)}</td>
                    <td>¥${formatMoney(w.fee)}</td>
                    <td>¥${formatMoney(w.actual_amount)}</td>
                    <td>${w.withdraw_type == 1 ? '银行卡' : '支付宝'}</td>
                    <td>${w.account_no || '-'}</td>
                    <td>${getStatusTag(w.status, 'withdrawal')}</td>
                    <td>${formatDate(w.created_at)}</td>
                    <td>
                        ${w.status == 0 ? `
                            <button class="btn btn-success btn-sm" onclick="approve(${w.id})">通过</button>
                            <button class="btn btn-danger btn-sm" onclick="reject(${w.id})">拒绝</button>
                        ` : ''}
                        ${w.status == 1 ? `
                            <button class="btn btn-primary btn-sm" onclick="markPaid(${w.id})">确认打款</button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');
        }

        async function approve(id) {
            if (!await confirm('确定通过该提现申请吗？')) return;
            try {
                const res = await post(`/admin/withdrawals/${id}/approve`);
                if (res.code === 0) { showToast('审核通过'); loadWithdrawals(currentPage); }
                else showToast(res.message, 'error');
            } catch (err) { showToast('操作失败', 'error'); }
        }

        async function reject(id) {
            if (!await confirm('确定拒绝该提现申请吗？金额将退回用户余额。')) return;
            try {
                const res = await post(`/admin/withdrawals/${id}/reject`);
                if (res.code === 0) { showToast('已拒绝'); loadWithdrawals(currentPage); }
                else showToast(res.message, 'error');
            } catch (err) { showToast('操作失败', 'error'); }
        }

        async function markPaid(id) {
            if (!await confirm('确定已完成打款吗？')) return;
            try {
                const res = await post(`/admin/withdrawals/${id}/paid`);
                if (res.code === 0) { showToast('已确认打款'); loadWithdrawals(currentPage); }
                else showToast(res.message, 'error');
            } catch (err) { showToast('操作失败', 'error'); }
        }

        loadUserInfo();
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('status')) document.getElementById('filterStatus').value = urlParams.get('status');
        loadWithdrawals();

        // 侧边栏切换
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }
    </script>
</body>
</html>
